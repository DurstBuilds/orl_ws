# Preset joint positions for joint_position_sequence_node (degrees).
# Edit waypoints for your bench test; hip targets are clamped to ±hip_angle_limit_deg.

position_tolerance_deg: 5.0
settle_timeout_sec: 10.0

waypoints:
  - delay_sec: 1.0
    positions:
      knee_motor: 0.0
      hip_motor: 0.0
      wheel_motor1: 0.0
      wheel_motor2: 0.0
  - delay_sec: 1.0
    positions:
      knee_motor: 90.0
      hip_motor: 0.0
      wheel_motor1: 180.0
      wheel_motor2: 180.0
  - delay_sec: 1.0
    positions:
      knee_motor: 0.0
      hip_motor: 0.0
      wheel_motor1: 0.0
      wheel_motor2: 0.0
