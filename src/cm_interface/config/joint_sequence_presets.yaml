# Preset joint waypoints for joint_position_sequence_node.
# Select one at launch with: joint_sequence:=KneeTumble (or HipSuperman).
# Hip targets are clamped to ±hip_angle_limit_deg at runtime.
#
# Each waypoint motor block:
#   position  — required, degrees
#   omega_max — optional, motor rad/s cap for this waypoint (persists until changed)
#   kp, kd    — optional, MIT gains for this waypoint (persists until changed)
# Omitted omega_max/kp/kd keep the last published values, or translator
# launch defaults if never set. Sequence end restores translator baselines.

presets:
  KneeTumble:
    position_tolerance_deg: 1.0
    settle_timeout_sec: 10.0
    waypoints:
      - delay_sec: 1.0
        knee_motor:
          position: 0.0
          omega_max: 2.0
        hip_motor:
          position: 0.0
          omega_max: 2.0
        wheel_motor1:
          position: 0.0
          omega_max: 2.0
        wheel_motor2:
          position: 0.0
          omega_max: 2.0
      - delay_sec: 1.0
        knee_motor:
          position: 90.0
        hip_motor:
          position: 0.0
        wheel_motor1:
          position: 180.0
        wheel_motor2:
          position: 180.0
      - delay_sec: 1.0
        knee_motor:
          position: 0.0
        hip_motor:
          position: 0.0
        wheel_motor1:
          position: 0.0
        wheel_motor2:
          position: 0.0

  HipSuperman:
    position_tolerance_deg: 1.0
    settle_timeout_sec: 10.0
    waypoints:
      - delay_sec: 1.0
        knee_motor:
          position: 0.0
          omega_max: 2.0
        hip_motor:
          position: 0.0
          omega_max: 2.0
        wheel_motor1:
          position: 0.0
          omega_max: 2.0
        wheel_motor2:
          position: 0.0
          omega_max: 2.0
      - delay_sec: 1.0
        knee_motor:
          position: -90.0
        hip_motor:
          position: 0.0
        wheel_motor1:
          position: -180.0
        wheel_motor2:
          position: -180.0
      - delay_sec: 1.5
        knee_motor:
          position: -90.0
        hip_motor:
          position: -90.0
        wheel_motor1:
          position: -180.0
        wheel_motor2:
          position: -180.0
      - delay_sec: 1.0
        knee_motor:
          position: -90.0
        hip_motor:
          position: 0.0
        wheel_motor1:
          position: -180.0
        wheel_motor2:
          position: -180.0
      - delay_sec: 2.0
        knee_motor:
          position: 0.0
        hip_motor:
          position: 0.0
        wheel_motor1:
          position: 0.0
        wheel_motor2:
          position: 0.0

  HipAnglesHolding:
    position_tolerance_deg: 1.0
    settle_timeout_sec: 10.0
    waypoints:
      - delay_sec: 1.0
        knee_motor:
          position: 0.0
          omega_max: 1.0
        hip_motor:
          position: 0.0
          omega_max: 10.0
        wheel_motor1:
          position: 0.0
          omega_max: 1.0
        wheel_motor2:
          position: 0.0
          omega_max: 1.0
      - delay_sec: 1.0
        knee_motor:
          position: -90.0
        hip_motor:
          position: 0.0
        wheel_motor1:
          position: -180.0
        wheel_motor2:
          position: -180.0
      - delay_sec: 1.5
        knee_motor:
          position: -90.0
        hip_motor:
          position: -15.0
        wheel_motor1:
          position: -180.0
        wheel_motor2:
          position: -180.0
      - delay_sec: 4.0
        knee_motor:
          position: -90.0
        hip_motor:
          position: -30.0
        wheel_motor1:
          position: -180.0
        wheel_motor2:
          position: -180.0
      - delay_sec: 4.0
        knee_motor:
          position: -90.0
        hip_motor:
          position: -45.0
        wheel_motor1:
          position: -180.0
        wheel_motor2:
          position: -180.0
      - delay_sec: 4.0
