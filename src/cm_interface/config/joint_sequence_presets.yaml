        hip_motor:
          position: 0.0
        wheel_motor1:
          position: 0.0
        wheel_motor2:
          position: 0.0
      - delay_sec: 0.5
        knee_motor:
          position: -45.0
          kp: 50.0
          kd: 0.25
        hip_motor:
          position: 0.0
        wheel_motor1:
          position: 360.0
        wheel_motor2:
          position: 360.0
      - delay_sec: 2.0
        knee_motor:
          position: -45.0
          omega_max: 0.5
          kp: 10.0
          kd: 0.25
        hip_motor:
          position: 0.0
        wheel_motor1:
          position: 540.0
        wheel_motor2:
          position: 540.0