      - delay_sec: 1.0
        knee_motor:
          position: 0.0
          omega_max: 2.0
        hip_motor:
          position: 0.0
        wheel_motor1:
          position: 0.0
        wheel_motor2:
          position: 0.0
      - delay_sec: 2.0
        knee_motor:
          position: -45.0
          omega_max: 1.0
          kp: 50.0
