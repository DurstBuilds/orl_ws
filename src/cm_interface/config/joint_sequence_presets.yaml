  HipReversal:
    position_tolerance_deg: 1.0
    settle_timeout_sec: 10.0
    waypoints:
      - delay_sec: 0.5
        knee_motor:
          position: 0.0
          omega_max: 2.25
        hip_motor:
          position: 0.0
          omega_max: 45.0
        wheel_motor1:
          position: 0.0
          omega_max: 2.0
        wheel_motor2:
          position: 0.0
          omega_max: 2.0
      - delay_sec: 0.5
        knee_motor:
          position: 80.0
        hip_motor:
          position: 80.0
        wheel_motor1:
          position: 0.0
        wheel_motor2:
          position: 0.0
      - delay_sec: 0.5
        knee_motor:
          position: 0.0
        hip_motor:
          position: 0.0
        wheel_motor1:
          position: 0.0
        wheel_motor2:
          position: 0.0
      - delay_sec: 0.5
        knee_motor:
          position: -80.0
        hip_motor:
          position: -80.0
        wheel_motor1:
          position: 0.0
        wheel_motor2:
          position: 0.0
      - delay_sec: 0.5
        knee_motor:
          position: 0.0
        hip_motor:
          position: 0.0
        wheel_motor1:
          position: 0.0
        wheel_motor2:
          position: 0.0

  StiffnessTest:
    position_tolerance_deg: 1.0
    settle_timeout_sec: 10.0
    waypoints:
      - delay_sec: 1.0
        knee_motor:
          position: 0.0
          omega_max: 2.0
        hip_motor:
          position: 0.0
        wheel_motor1:
          position: 0.0
        wheel_motor2:
          position: 0.0
      - delay_sec: 1.0
        knee_motor:
          position: 45.0
          omega_max: 1.0
        hip_motor:
          position: 0.0
        wheel_motor1:
          position: 0.0
        wheel_motor2:
          position: 0.0
      - delay_sec: 5.0
        knee_motor:
          position: 0.0
          kp: 0.0
          kd: 0.25
        hip_motor:
          position: 0.0
        wheel_motor1:
          position: 0.0
        wheel_motor2:
          position: 0.0
      - delay_sec: 2.0
