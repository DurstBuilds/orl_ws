          position: -90.0
        hip_motor:
          position: -60.0
        wheel_motor1:
          position: -180.0
        wheel_motor2:
          position: -180.0
      - delay_sec: 4.0
        knee_motor:
          position: -90.0
        hip_motor:
          position: -75.0
        wheel_motor1:
          position: -180.0
        wheel_motor2:
          position: -180.0
      - delay_sec: 4.0
        knee_motor:
          position: -90.0
        hip_motor:
          position: -90.0
        wheel_motor1:
          position: -180.0
        wheel_motor2:
          position: -180.0
      - delay_sec: 4.0
        knee_motor:
          position: -90.0
        hip_motor:
          position: 0.0
        wheel_motor1:
          position: -180.0
        wheel_motor2:
          position: -180.0
      - delay_sec: 4.0
